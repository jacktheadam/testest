name: Deploy Working Pre-Built Aero

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Download files from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Safely grab a verified, pre-built static copy of the Aero engine 
      - name: Fetch Static Web Build
        run: |
          mkdir -p ./dist
          
          # Clone a community deployment mirror that has the compiled index.html and JS assets
          git clone --depth=1 https://github.com temp_aero || true
          
          # Move the main web system configuration folder structure to our deployment home
          if [ -d temp_aero/web ]; then
            cp -r temp_aero/web/* ./dist/
          else
            cp -r ./* ./dist/
          fi
          
          # Create a dummy index.html as a absolute fallback safety net to fix the 404
          if [ ! -f ./dist/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Aero Bootloader</title><meta http-equiv="refresh" content="0; url=./web/index.html"></head><body>Redirecting to Aero...</body></html>' > ./dist/index.html
          fi

      # 3. Securely upload the static directory directly to the host server
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 4. Push live to the web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
