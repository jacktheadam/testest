[package]
name = "aero-usb"
version = "0.1.0"
rust-version.workspace = true
edition = "2021"
publish = false

[dependencies]
aero-io-snapshot = { path = "../aero-io-snapshot" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.4"
