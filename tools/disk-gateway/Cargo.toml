[package]
name = "disk-gateway"
version = "0.1.0"
rust-version.workspace = true
edition = "2021"
publish = false

[dependencies]
aero-http-range = { path = "../../crates/aero-http-range" }
axum = { version = "0.8", features = ["macros"] }
async-stream = "0.3"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
httpdate = "1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
time = { version = "0.3", features = ["formatting", "serde"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
tempfile = "3"

