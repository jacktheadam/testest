[package]
name = "aero-gpu-trace-replay"
version = "0.1.0"
rust-version.workspace = true
edition = "2021"
publish = false

[dependencies]
aero-gpu-trace = { path = "../aero-gpu-trace" }
aero-protocol = { path = "../aero-protocol" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.18"
thiserror = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "3"
aero-d3d11 = { path = "../aero-d3d11" }
aero-dxbc = { path = "../aero-dxbc", features = ["test-utils"] }
aero-gpu = { path = "../aero-gpu" }
pollster = "0.3"
