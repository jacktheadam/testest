[package]
name = "aero-shared"
version = "0.1.0"
rust-version.workspace = true
edition = "2021"
publish = false

[features]
# Enables Loom-based concurrency testing for the publish protocol.
loom = ["dep:loom"]

[dependencies]
aero-protocol = { path = "../aero-protocol" }
loom = { version = "0.7", optional = true }
