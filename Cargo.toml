[package]
name = "aero"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
# Resolver 3 is MSRV-aware: combined with `workspace.package.rust-version` it
# picks dependency versions the pinned toolchain can actually build, instead of
# resolving to the newest release and failing the `--locked` gate. See the Rust
# toolchain policy decision in the wiki.
resolver = "3"
members = [
    "crates/aero-acpi",
    "crates/aero-pci-routing",
    "crates/aero-audio",
    "crates/aero-auth-tokens",
    "crates/aero-fuzz",
    "crates/aero-aerogpu",
    "crates/aero-gpu",
    "crates/aero-gpu-trace",
    "crates/aero-gpu-trace-replay",
    "crates/aero-gpu-utils",
    "crates/aero-gpu-wasm",
    "crates/aero-shared",
    "crates/aero-edid",
    "crates/aero-core",
    "crates/aero-boot-tests",
    "crates/aero-tests",
    "crates/aero-http-range",
    "crates/aero-ipc",
    "crates/aero-wasm",
    "crates/aero-jit-x86",
    # Built directly by `wasm-pack` in `web/scripts/build_wasm.mjs`; Cargo requires that
    # packages under the workspace root are explicitly listed here (or in `exclude`).
    "crates/aero-jit-wasm",
    "crates/aero-jit",
    "crates/aero-microbench",
    "crates/aero-net-backend",
    "crates/aero-net-e1000",
    "crates/aero-net-pump",
    "crates/aero-l2-protocol",
    "crates/aero-tcp-mux-protocol",
    "crates/aero-udp-relay-protocol",
    "crates/aero-l2-proxy",
    "crates/aero-pcapng",
    "crates/aero-net-stack",
    "crates/aero-net-trace",
    "crates/aero-storage",
    "crates/aero-storage-adapters",
    "crates/aero-mem",
    "crates/aero-perf",
    "crates/aero-mmu",
    "crates/aero-snapshot",
    "crates/aero-smp",
    "crates/aero-io-snapshot",
    "crates/aero-opfs",
    "crates/aero-storage-server",
    "crates/aero-virtio",
    "crates/aero-webgpu",
    "crates/aero-cpu-core",
    "crates/aero-types",
    "crates/aero-x86",
    "crates/aero-cpu-decoder",
    "crates/aero-dxbc",
    "crates/aero-d3d9",
    "crates/aero-debug",
    "crates/aero-interrupts",
    "crates/aero-d3d11",
    # wasm-pack package used by web harnesses / Playwright tests.
    "crates/aero-d3d11-wasm",
    "crates/aero-machine",
    "crates/aero-machine-cli",
    "crates/devices",
    "crates/firmware",
    "crates/memory",
    "crates/platform",
    "crates/aero-guest-phys",
    "crates/aero-pc-constants",
    "crates/aero-pc-platform",
    "crates/aero-pci-firmware-adapter",
    "crates/perf",
    "crates/aero-devices-input",
    "crates/aero-devices-gpu",
    "crates/aero-devices-nvme",
    "crates/aero-devices-storage",
    "crates/nt-packetlib",
    # Generated by cargo-hakari to unify feature selection across the workspace.
    # Excluded from the wasm32 dependency cone; see `.config/hakari.toml`.
    "crates/workspace-hack",
    # `services/gateway/` and `services/net-proxy/` are TypeScript services with no
    # Cargo manifest, so they are not workspace members.
    "tools/bcd_patch",
    "tools/device_contract_validator",
    "tools/aero-disk-convert",
    "tools/qemu_diff",
    "crates/virtio-gpu-proto",
    "crates/aero-usb",
    "crates/st-idb",
    "crates/conformance",
    "crates/aero-protocol",
    "crates/aero-gpu-software",
    "crates/aero-gpu-vga",
    "drivers/protocol/virtio",
    "crates/aero-time",
    "crates/aero-timers",
    # Legacy/reference-only SM2/SM3 token-stream parser + disassembler; kept in-workspace so it
    # can be exercised by unit tests and fuzzing.
    "crates/legacy/aero-d3d9-shader",
    "xtask",
    "tools/disk-gateway",
    "tools/image-chunker",
    "tools/packaging/aero_packager",
    "tools/win-certstore-regblob-export",
    "tools/win-offline-cert-injector",
    "tools/win7-slipstream",
]

exclude = [
    # cargo-fuzz needs its own workspace and lockfile.
    "fuzz",
]

# The interpreter's hot path crosses a crate boundary on nearly every guest
# instruction: Tier-0 calls `CpuBus`, which is `aero-machine` -> `aero-pc-platform`
# -> `memory` -> `aero-platform` before a byte of guest RAM is touched. With the
# default 16 codegen units and no LTO none of that inlines, so each guest
# instruction pays several real calls plus `Result` plumbing.
[profile.release]
lto = "fat"
codegen-units = 1

# Fuzz/bench targets inherit the same cross-crate inlining requirement.
[profile.bench]
lto = "fat"
codegen-units = 1

[dev-dependencies]
aero-d3d9 = { path = "crates/aero-d3d9" }
aero-d3d11 = { path = "crates/aero-d3d11" }
aero-dxbc = { path = "crates/aero-dxbc", features = ["test-utils"] }
aero-gpu = { path = "crates/aero-gpu" }
aero-protocol = { path = "crates/aero-protocol" }
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
futures-intrusive = "0.5"
image = { version = "0.25.5", default-features = false, features = ["png", "pnm"] }
pollster = "0.3"
serde_json = "1.0"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
wasm-bindgen-test = "0.3"
wgpu = "0.20"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dependencies]
workspace-hack = { version = "0.1", path = "crates/workspace-hack" }

[workspace.package]
edition = "2021"
# Kept in step with `rust-toolchain.toml`. The MSRV-aware resolver reads this to
# avoid selecting dependencies that need a newer compiler than the pinned one.
rust-version = "1.92"

[workspace.dependencies]
bitflags = "2.11.0"
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "instr_info", "std"] }
thiserror = "2.0.17"
