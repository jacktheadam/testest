[package]
name = "aero-mem"
version = "0.1.0"
rust-version.workspace = true
edition = "2021"
publish = false

[dependencies]
memory = { path = "../memory", optional = true }

[features]
default = []
# Implements compatibility traits for the older `crates/memory` subsystem.
memory-compat = ["dep:memory"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"
proptest = "1.5"

[[bench]]
name = "bulk"
harness = false
