name: Direct Deploy Aero Emulator

on:
  push:
    branches: [ "main" ] # Triggers on saving to the main branch

permissions:
  contents: read    # Gives permission to read files
  pages: write       # Gives permission to deploy to GitHub Pages
  id-token: write    # Required for GitHub authentication

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Download files from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Skip compiling entirely and directly host the repository root 
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      # 3. Deploy the pre-built files straight to your website link
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
