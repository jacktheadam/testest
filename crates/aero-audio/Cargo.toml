[package]
name = "aero-audio"
version = "0.1.0"
rust-version.workspace = true
edition = "2021"
publish = false

[dependencies]
aero-devices = { path = "../devices" }
aero-platform = { path = "../platform" }
aero-io-snapshot = { path = "../aero-io-snapshot", optional = true }
memory = { path = "../memory" }

[features]
# Higher-quality windowed-sinc resampling, at a cost in CPU. The linear resampler is the default.
sinc-resampler = []
io-snapshot = ["dep:aero-io-snapshot"]

[dev-dependencies]
aero-io-snapshot = { path = "../aero-io-snapshot" }
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[test]]
name = "hda_snapshot_roundtrip"
path = "tests/hda_snapshot_roundtrip.rs"
required-features = ["io-snapshot"]

[[bench]]
name = "audio_ring"
harness = false

[[bench]]
name = "dsp"
harness = false
