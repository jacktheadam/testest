name: Build and Deploy Aero Emulator

on:
  push:
    branches: [ "main" ] # Triggers whenever you save code to the main branch

permissions:
  contents: read    # Allows reading code files
  pages: write       # Allows uploading files to GitHub Pages
  id-token: write    # Required for secure authentication with Pages

# Ensures only one deployment runs at a time to prevent conflicts
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up the Rust compiler (Required for Aero's WebAssembly core)
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. Set up Node.js for building the web environment
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 4. Install project dependencies and compile the emulator
      - name: Install Dependencies and Build Aero
        run: |
          npm ci
          npm run build:prod

      # 5. Tell GitHub Pages to prepare your static build folder
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Tells it to use the exact output folder created by Aero

      # 6. Deploy the artifact live to the web
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
