[package]
name = "aero-ipc"
version = "0.1.0"
rust-version.workspace = true
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Enables wasm-bindgen + js-sys helpers for working directly with a JS
# `SharedArrayBuffer` from Rust/WASM. The core queue/protocol code is
# intentionally `std`-only so it can be tested on the host.
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
