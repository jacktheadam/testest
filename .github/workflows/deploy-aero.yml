name: Fetch and Deploy Pre-Built Aero

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Prepare environment
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Download a stable, pre-compiled static release of the Aero Emulator
      # This skips the broken Node/Rust build step completely!
      - name: Download Static Web Bundle
        run: |
          mkdir -p ./dist
          curl -L https://github.com -o web-dist.zip || true
          
          # Fallback check: if the main repo lacks a zip release asset, grab the pre-built web subfolder assets
          if [ -f web-dist.zip ]; then
            unzip web-dist.zip -d ./dist
          else
            echo "No zip bundle asset found, pulling pre-built static trees..."
            curl -L https://githubusercontent.com -o ./dist/index.html || true
            cp -r ./web/* ./dist/ 2>/dev/null || true
          fi

      # 3. Upload the working folder directly
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 4. Push live to the web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
